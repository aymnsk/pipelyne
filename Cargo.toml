[package]
name = "pipelyne"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A production-ready machine learning framework in Rust"
repository = "https://github.com/aymnsk/pipelyne"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["machine-learning", "rust", "cli", "educational"]
categories = ["command-line-utilities", "science", "education"]

# Add this section if not present
[lib]
name = "pipelyne"
path = "src/lib.rs"

[[bin]]
name = "pipelyne"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
ordered-float = "3.10"
